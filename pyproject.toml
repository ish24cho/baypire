[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "baypire"
version = "0.1.0"
description = "Bayesian prompt-item recovery experiments for sparse LLM evaluation."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "pyyaml>=6.0",
  "pyarrow>=15.0",
  "scikit-learn>=1.4",
  "pymc>=5.0",
  "arviz>=0.16",
]

[tool.setuptools.packages.find]
where = ["src"]

